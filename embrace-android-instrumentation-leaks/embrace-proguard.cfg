## androidx.fragment is a compileOnly dependency of this module, used only for Fragment and Fragment View leak
## detection. It is not required if the host app doesn't include the Fragment library - no need to keep these
## classes resolvable for runtime.
-dontwarn androidx.fragment.app.Fragment
-dontwarn androidx.fragment.app.FragmentActivity
-dontwarn androidx.fragment.app.FragmentManager
-dontwarn androidx.fragment.app.FragmentManager$FragmentLifecycleCallbacks

## Leak suspects are reported by class name, so keep Fragment names readable.
-keepnames class * extends androidx.fragment.app.Fragment

## androidx.lifecycle:lifecycle-viewmodel is a compileOnly dependency of this module, used only for ViewModel leak
## detection, which is only ever invoked from an instrumented ViewModel constructor.
-dontwarn androidx.lifecycle.ViewModel

## Lifecycle 2.5 to 2.7 only have addCloseable(Closeable), which is called reflectively - see ViewModelLeakTracker.
-keepclassmembers class androidx.lifecycle.ViewModel {
    public void addCloseable(java.io.Closeable);
}

## Leak suspects are reported by class name, so keep ViewModel names readable.
-keepnames class * extends androidx.lifecycle.ViewModel
