<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="threads-one-order-title threads-one-order-desc">
<title id="threads-one-order-title">Three threads report a state change at once, and one lock gives the changes one order</title>
<desc id="threads-one-order-desc">Three threads each report a change of a state within a millisecond. They pass one at a time through the recorder&#x27;s lock, which numbers the changes 41, 42 and 43, and the journal, the events for the app&#x27;s exporters, and every log and span that reads the snapshot without the lock all see that one order.</desc>
