name: Android

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ main ]
  # seed the AVD and Gradle caches from main.
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 29
        working-directory: ['.', 'examples/ExampleApp']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the emulator
        uses: $/.github/actions/emulator-setup
        with:
          api-level: ${{ matrix.api-level }}

      - name: Run tests on android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        if: matrix.working-directory == 'examples/ExampleApp'
        with:
          working-directory: ${{ matrix.working-directory }}
          api-level: ${{ matrix.api-level }}
          # Grab the failures from the device so we can include them in results. Exit with non-zero so GH checks still fail.
          # Run once against opentelemetry-kotlin's compat implementation (the default) and once against its regular implementation.
          script: |
            ./gradlew connectedCheck -x :app:benchmark:connectedBenchmarkAndroidTest -x :app:benchmark:connectedBenchmarkOtelRegularAndroidTest
            ./gradlew connectedCheck -x :app:benchmark:connectedBenchmarkAndroidTest -x :app:benchmark:connectedBenchmarkOtelRegularAndroidTest -PtestBuildType=otelRegular

      - name: Run tests on android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        if: matrix.working-directory != 'examples/ExampleApp'
        with:
          working-directory: ${{ matrix.working-directory }}
          api-level: ${{ matrix.api-level }}
          # Grab the failures from the device so we can include them in results. Exit with non-zero so GH checks still fail.
          script: ./gradlew connectedCheck -x :embrace-microbenchmark:connectedCheck -x :embrace-macrobenchmark:connectedCheck -x :embrace-macrobenchmark-app:connectedCheck -Pembrace.abiFilters=x86 --stacktrace || (adb logcat '[Embrace]:d' '*:S' -t 100000 > emulator_logcat.log && adb pull /storage/emulated/0/Android/data/io.embrace.android.embracesdk.test/cache/test_failure/ && exit 127)

      - name: Archive Test Results
        if: ${{ always() && matrix.working-directory == '.' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-emulator-${{ matrix.working-directory }}-test-results
          path: |
            embrace-android-sdk/build/reports/androidTests/connected
            embrace-minified-test-app/build/reports/androidTests/connected
            test_failure
            emulator_logcat.log
