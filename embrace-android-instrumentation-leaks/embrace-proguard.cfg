## androidx.fragment is a compileOnly dependency of this module, used only for Fragment and Fragment View leak
## detection. It is not required if the host app doesn't include the Fragment library - no need to keep these
## classes resolvable for runtime.
-dontwarn androidx.fragment.app.Fragment
-dontwarn androidx.fragment.app.FragmentActivity
-dontwarn androidx.fragment.app.FragmentManager
-dontwarn androidx.fragment.app.FragmentManager$FragmentLifecycleCallbacks
