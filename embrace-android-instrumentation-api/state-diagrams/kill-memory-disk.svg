<rect x="0.5" y="0.5" width="959" height="473" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/>
<text x="24" y="38" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1F2933" font-weight="600">Memory and disk at a kill</text>
<text x="24" y="72" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">Killed during a session part</text>
<rect x="24" y="91" width="912" height="46" rx="6" fill="#F5F7FA"/>
<text x="36" y="111" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2933">In memory</text>
