<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 522" width="960" height="522" role="img" aria-labelledby="span-link-cases-title span-link-cases-desc">
<title id="span-link-cases-title">Six spans, and which of the two sequence numbers each carries</title>
<desc id="span-link-cases-desc">A span that reads the sequence as it runs carries a start number, an end number if a state changed while it ran, or only an end number if it started before any state had a value. A span that is given its times is placed among the recorder&#x27;s last 64 snapshots, and gets no number for a time older than those.</desc>
