import io.embrace.android.gradle.plugin.tasks.common.MultipartUploadTask
import io.embrace.android.gradle.plugin.network.EmbraceEndpoint

plugins {
    id("java")
    id("io.embrace.gradle")
    id("io.embrace.android.testplugin")
}

project.tasks.register("proguardEndpointTask", MultipartUploadTask) { task ->
    integrationTest.configureGradleUploadTask(project, task, EmbraceEndpoint.PROGUARD, "my-filename.txt")

    task.uploadFile.set(
            project.layout.projectDirectory.file("input.txt")
    )
}

project.tasks.register("ndkEndpointTask", MultipartUploadTask) { task ->
    integrationTest.configureGradleUploadTask(project, task, EmbraceEndpoint.NDK, "my-filename.txt")

    task.uploadFile.set(
            project.layout.projectDirectory.file("input.txt")
    )
}
