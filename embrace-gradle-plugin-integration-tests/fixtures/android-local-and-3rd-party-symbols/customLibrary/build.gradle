plugins {
    id("com.android.library")
}

def agpVersion = project.findProperty("agp_version") ?: "8.0.0"
def agpMajorVersion = agpVersion.toString().split("\\.")[0].toInteger()
if (agpMajorVersion < 9) {
    apply plugin: "org.jetbrains.kotlin.android"
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def abis = project.findProperty("abiFilters")?.toString()?.split(",") ?: ["arm64-v8a", "x86_64"]

android {
    namespace 'com.example.customLibrary'
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        minSdk 26
        ndk {
            abiFilters(*abis)
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }
}
