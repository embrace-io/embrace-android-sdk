syntax = "proto3";

package embrace.session.persistence;

option java_package = "io.embrace.android.embracesdk.internal.session.persistence";

// The journal of state changes persisted for one session part. It is only ever appended to: each
// append is a StateJournal message holding the records being added, so the file as a whole reads
// back as one StateJournal with every record in the order it was appended.
//
// A journal opens with a checkpoint and a part start, then holds the changes made during the part,
// and a part end if the part ended in the process that started it. It holds no change made while no
// session part was in progress: such a change is counted for its state in the part start of the
// next journal. The changes are in the order of their sequence, and the first is numbered above the
// checkpoint. A change made during the part that a limit refused is not recorded and keeps its
// number, so the numbers of the changes can skip, anywhere among them. The first change a limit
// refuses in a part is followed by a record of that limit, and the part end counts what is missing.
message StateJournal {
  uint32 format_version = 1;
  repeated StateRecord records = 2;

  // When the write ending with this field was made, in milliseconds since the epoch by the SDK clock.
  // Every write to the journal ends with one, after its records. 0 if unknown.
  int64 written_at_ms = 3;
}

// One entry in the journal. Exactly one of checkpoint, change, part_start, part_end and
// limit_reached is set.
message StateRecord {
  // The place of this record in the order of state changes, which runs for the life of the process.
  // A change takes the next number. Any other record carries the number of the last change before it.
  int64 sequence = 1;

  // When what the record describes happened, in milliseconds since the epoch.
  int64 time_ms = 2;

  StateCheckpoint checkpoint = 3;
  StateChange change = 4;
  StatePartStart part_start = 5;
  StatePartEnd part_end = 6;
  StateLimitReached limit_reached = 7;
}

// The value of one state.
message StateValue {
  // The name of the state, such as "network".
  string state = 1;
  string value = 2;

  // Whether the value was generated by the SDK rather than observed from the app.
  bool system = 3;
}

// The value of every state being captured, as of the record's sequence.
message StateCheckpoint {
  repeated StateValue values = 1;
}

// One state taking a new value. A state's first value is recorded as a change too.
message StateChange {
  StateValue value = 1;
  map<string, string> attributes = 2;
}

// The session part the journal belongs to started. Its sequence is the checkpoint's: the number of
// the last change made before the part.
message StatePartStart {
  // A journal written by an earlier build of the proof of concept used field 1 for a count of
  // changes made before the part that it did not hold. Nothing writes it or reads it.
  reserved 1;
  reserved "dropped_changes";

  // For each state that changed while no session part was in progress, how many of its changes
  // took a number since the journal before this one ended, or since the process started. Those
  // changes are in no journal. The checkpoint holds the values after them.
  repeated StateNotInSessionCount not_in_session_counts = 2;
}

// How many changes of one state were made while no session part was in progress.
message StateNotInSessionCount {
  // The name of the state.
  string state = 1;

  // How many changes of the state took a number with no journal open. A state's first value counts
  // like any other change. An update that repeated the state's value took no number and is not
  // counted.
  int32 count = 2;
}

// The session part ended in the process that started it.
message StatePartEnd {
  // Changes made during the part that took a number and were not recorded, as a limit refused
  // them: the limit of the change's own state, or the limit on the journal as a whole.
  int32 dropped_changes = 1;

  // The value, when the part ended, of each state that had a change refused, as that value cannot
  // be worked out from the records. A journal written before states had limits of their own holds
  // every state's value here, whenever it dropped a change.
  repeated StateValue values = 2;

  // What the journal does not list of each state, for the states it does not list something of.
  // A journal written before states had limits of their own holds none.
  repeated StateDroppedCount dropped_counts = 3;

  // The most changes the journal holds for every state together. Set only if that limit refused a
  // change during the part.
  optional int32 global_limit = 4;
}

// How many changes of one state the journal of a session part does not list.
message StateDroppedCount {
  // The name of the state.
  string state = 1;

  // The changes of the state made during the part that a limit refused, which took a number, and
  // the changes the state's reporter said it never passed on, which took none. Those reported
  // while no session part was in progress are counted in the journal of the next part to start.
  int32 count = 2;

  // The most changes of the state that one session part lists. Set only if that limit, and not
  // the limit on the journal as a whole, refused a change of the state during the part.
  optional int32 limit = 3;

  // The sequence of the state's last change during the part. Set only if a limit refused a change
  // of the state during the part. It is where the state's value in the part end holds from: the
  // state's value is not known between the first change the journal does not list and this one.
  optional int64 final_sequence = 4;
}

// A limit on what the journal lists refused a change, for the first time in the session part. It
// is recorded as it happens, so that a journal whose part end was never written still says which
// limits were reached. One is written in a part for each state whose own limit refuses a change,
// and one for the limit on the journal as a whole. It is not a change: its record carries the
// sequence of the change that was refused, which is the last change made, and that change's time.
message StateLimitReached {
  // The state whose own limit refused a change of it. Not set where the limit is the one on the
  // journal as a whole.
  optional string state = 1;

  // The limit: the most changes of the state that one session part lists, or the most changes the
  // journal holds for every state together.
  int32 limit = 2;
}
