<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" width="960" height="388" role="img" aria-labelledby="boundary-race-title boundary-race-desc">
<title id="boundary-race-title">Two changes reported just after a session part boundary, and the journal that lists each</title>
<desc id="boundary-race-desc">One session part&#x27;s span ends and the next one&#x27;s starts at the same time, and the journals change over a little later, each under the recorder&#x27;s lock. A change reported in between is listed in the first part&#x27;s journal after that part&#x27;s span has ended, or held and listed in the next part&#x27;s journal before its part start.</desc>
<defs><marker id="boundary-race-arrow-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#D97706"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="387" rx="12" fill="#FFFFFF" stroke="#D8DEE4"/>
<text x="24" y="38" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#1F2933" font-weight="600">A change racing a session part boundary</text>
<rect x="184" y="244" width="752" height="44" rx="6" fill="#F5F7FA"/>
<line x1="372" y1="86" x2="372" y2="288" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="506" y1="158" x2="506" y2="288" stroke="#2563EB" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="680" y1="158" x2="680" y2="288" stroke="#2563EB" stroke-width="1" stroke-dasharray="2 4"/>
<text x="24" y="103" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2933">Session part spans</text>
<text x="24" y="120" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">by their own times</text>
<rect x="196" y="94" width="174" height="24" rx="4" fill="#7C3AED"/>
<text x="283" y="110.3" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Part A&#x27;s span</text>
<rect x="374" y="94" width="562" height="24" rx="4" fill="#7C3AED"/>
<text x="655" y="110.3" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">Part B&#x27;s span</text>
<text x="372" y="80" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D" text-anchor="middle">A&#x27;s span ends, and B&#x27;s starts at once</text>
<text x="24" y="177" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2933">Journals</text>
<text x="24" y="194" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">by the recorder&#x27;s lock</text>
<rect x="196" y="165" width="310" height="30" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<rect x="512" y="165" width="162" height="30" rx="5" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="680" y="165" width="256" height="30" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="196" y="154" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">Part A&#x27;s journal</text>
<text x="936" y="154" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D" text-anchor="end">Part B&#x27;s journal</text>
<text x="593" y="184" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D" text-anchor="middle">no journal: held</text>
<text x="506" y="154" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1F2933" text-anchor="middle">endJournal</text>
<text x="680" y="154" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1F2933" text-anchor="middle">beginJournal</text>
<line x1="744" y1="165" x2="744" y2="195" stroke="#2563EB" stroke-width="1.5"/>
<text x="751" y="184" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">part start</text>
<text x="24" y="263" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1F2933">A reporting thread</text>
<text x="24" y="280" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">by the time it gives</text>
<line x1="318" y1="257" x2="318" y2="190" stroke="#D97706" stroke-width="1.5" marker-end="url(#boundary-race-arrow-d97706)"/>
<line x1="438" y1="257" x2="438" y2="190" stroke="#D97706" stroke-width="1.5" marker-end="url(#boundary-race-arrow-d97706)"/>
<line x1="862" y1="257" x2="862" y2="190" stroke="#D97706" stroke-width="1.5" marker-end="url(#boundary-race-arrow-d97706)"/>
<path d="M592 257 L592 214 L708 214 L708 190" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#boundary-race-arrow-d97706)"/>
<path d="M318 259 L325 266 L318 273 L311 266 Z" fill="#D97706"/>
<path d="M438 259 L445 266 L438 273 L431 266 Z" fill="#D97706"/>
<path d="M592 259 L599 266 L592 273 L585 266 Z" fill="#D97706"/>
<path d="M862 259 L869 266 L862 273 L855 266 Z" fill="#D97706"/>
<path d="M318 174 L324 180 L318 186 L312 180 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<path d="M438 174 L444 180 L438 186 L432 180 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<path d="M708 174 L714 180 L708 186 L702 180 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<path d="M862 174 L868 180 L862 186 L856 180 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<line x1="438" y1="275" x2="438" y2="299" stroke="#9AA5B1" stroke-width="1"/>
<text x="500" y="312" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1F2933" text-anchor="end">Listed in part A,</text>
<text x="500" y="328" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1F2933" text-anchor="end">after A&#x27;s span has ended</text>
<line x1="592" y1="275" x2="592" y2="299" stroke="#9AA5B1" stroke-width="1"/>
<text x="530" y="312" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1F2933">Held, then listed in part B before its part start,</text>
<text x="530" y="328" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#1F2933">after B&#x27;s span has started</text>
<path d="M31 351 L38 358 L31 365 L24 358 Z" fill="#D97706"/>
<text x="46" y="362" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">A change, as reported</text>
<path d="M204 352 L210 358 L204 364 L198 358 Z" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
<text x="218" y="362" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D">Where a journal lists it</text>
<text x="936" y="362" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#52606D" text-anchor="end">The lock decides the listing. The change&#x27;s time does not.</text>
</svg>
