name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DEPOT_RUNNER: depot-ubuntu-24.04-8

jobs:
  environment:
    runs-on: ubuntu-latest
    outputs:
      where: ${{ steps.choose.outputs.where }}
    steps:
      - id: choose
        run: |
          if [ ${GITHUB_ACTOR} != 'dependabot[bot]' ]; then
              echo "where=${DEPOT_RUNNER}" >> $GITHUB_OUTPUT
          else
              echo "where=ubuntu-latest" >> $GITHUB_OUTPUT
          fi

  gradle:
    needs: environment
    runs-on: ${{ needs.environment.outputs.where }}
    timeout-minutes: 30
    strategy:
      matrix:
        gradle-task: ['build', 'bundleReleaseExampleApp', 'test']
      fail-fast: false
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        if: ${{ needs.environment.outputs.where == 'ubuntu-latest' }}
        with:
          tool-cache: false
          android: false

      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Codecov resolves the PR head commit via HEAD^2 of the merge commit, so a depth of 2 is needed
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: robolectric-cache
        if: ${{ matrix.gradle-task == 'build' }}
        with:
          path: |
            ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('.github/fetch-robolectric-dependencies.sh') }}

      - name: Fetch Robolectric dependencies
        if: ${{ matrix.gradle-task == 'build' && steps.robolectric-cache.outputs.cache-hit != 'true' }}
        run: /bin/sh .github/fetch-robolectric-dependencies.sh

      - name: Setup Node
        if: ${{ matrix.gradle-task == 'test' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: embrace-gradle-plugin-integration-tests/fixtures/react-native-android/package-lock.json

      - name: Restore TestKit caches
        id: testkit-cache
        if: ${{ matrix.gradle-task == 'test' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/embrace-testkit/caches/modules-2
            !~/.gradle/embrace-testkit/caches/modules-2/*.lock
            ~/.gradle/embrace-testkit/caches/build-cache-1
            ~/.gradle/wrapper/dists
          key: testkit-${{ hashFiles('embrace-gradle-plugin-integration-tests/src/test/kotlin/io/embrace/android/gradle/config/TestMatrix.kt', 'gradle/libs.versions.toml', 'embrace-gradle-plugin-integration-tests/fixtures/react-native-android/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            testkit-${{ hashFiles('embrace-gradle-plugin-integration-tests/src/test/kotlin/io/embrace/android/gradle/config/TestMatrix.kt', 'gradle/libs.versions.toml', 'embrace-gradle-plugin-integration-tests/fixtures/react-native-android/package-lock.json') }}-
            testkit-

      - name: Mark TestKit cache state
        if: ${{ matrix.gradle-task == 'test' }}
        run: touch "$RUNNER_TEMP/testkit-marker"

      - name: Gradle (embrace-gradle-plugin-integration-tests:test)
        if: ${{ matrix.gradle-task == 'test' }}
        run: ./gradlew embrace-gradle-plugin-integration-tests:test --warn

      - name: Check TestKit caches changed
        id: testkit-changed
        if: ${{ matrix.gradle-task == 'test' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [ -n "$(find ~/.gradle/embrace-testkit/caches -newer "$RUNNER_TEMP/testkit-marker" -type f 2>/dev/null | head -1)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save TestKit caches
        if: ${{ steps.testkit-changed.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/embrace-testkit/caches/modules-2
            !~/.gradle/embrace-testkit/caches/modules-2/*.lock
            ~/.gradle/embrace-testkit/caches/build-cache-1
            ~/.gradle/wrapper/dists
          key: ${{ steps.testkit-cache.outputs.cache-primary-key }}

      - name: Gradle (build -x embrace-gradle-plugin-integration-tests:test)
        if: ${{ matrix.gradle-task == 'build' }}
        run: ./gradlew ciBuild -x embrace-gradle-plugin-integration-tests:test -x embrace-minified-test-app:assemble -x embrace-macrobenchmark:assemble -x embrace-macrobenchmark-app:assemble -x embrace-apk-size:assemble -Pembrace.coverage --warn

      - name: Gradle (examples/ExampleApp/ bundleRelease)
        if: ${{ matrix.gradle-task == 'bundleReleaseExampleApp' }}
        working-directory: examples/ExampleApp
        run: ./gradlew bundleRelease --warn

      - name: Archive Test Results
        if: ${{ always() && matrix.gradle-task != 'bundleReleaseExampleApp' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.gradle-task }}
          path: '**/build/reports/tests/**'

      - name: Upload Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ matrix.gradle-task == 'build' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          fail_ci_if_error: true
          files: build/reports/kover/reportRelease.xml

  apk-size:
    needs: environment
    runs-on: ${{ needs.environment.outputs.where }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # stacked PRs are compared with main too, so they show the size change of the whole stack
      - name: Measure APK size on main
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --depth=1 origin main
          git worktree add "$RUNNER_TEMP/main" FETCH_HEAD
          cd "$RUNNER_TEMP/main"
          if [ -f embrace-apk-size/build.gradle.kts ]; then
            ./gradlew :embrace-apk-size:apkSizeReport --warn
          else
            echo "::notice::main has no embrace-apk-size module, so there is nothing to compare with."
            echo "No comparison with main: it has no embrace-apk-size module." >> "$RUNNER_TEMP/apk-size-notes.md"
          fi

      - name: Measure APK size
        run: |
          main_sizes="$RUNNER_TEMP/main/embrace-apk-size/build/reports/apk-size/apk-size.properties"
          if [ -f "$main_sizes" ]; then
            ./gradlew :embrace-apk-size:apkSizeReport --warn -Pembrace.apkSizeMain="$main_sizes"
          else
            if [ -f "$RUNNER_TEMP/main/embrace-apk-size/build.gradle.kts" ]; then
              echo "::warning::main built, but $main_sizes is missing, so there is no comparison."
              echo "No comparison with main: its build wrote no apk-size.properties." >> "$RUNNER_TEMP/apk-size-notes.md"
            fi
            ./gradlew :embrace-apk-size:apkSizeReport --warn
          fi

      # One comment per PR, edited on every change
      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- embrace-apk-size -->"
          body="$RUNNER_TEMP/apk-size-comment.md"
          {
            echo "$marker"
            cat embrace-apk-size/build/reports/apk-size/apk-size.md
            if [ -f "$RUNNER_TEMP/apk-size-notes.md" ]; then
              echo
              cat "$RUNNER_TEMP/apk-size-notes.md"
            fi
            echo
            echo "_Measured at $HEAD_SHA._"
          } > "$body"
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@"$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@"$body" > /dev/null
          fi
