name: Upload artifacts to Maven Central

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_TOKEN_USER }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_TOKEN_USER_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_ANDROID_SIGNING_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_ANDROID_GPG_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_ANDROID_SIGNING_PASSWORD }}

on:
  workflow_call:
    inputs:
      rc_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      rc_version:
        description: 'Version to create new RC for. Specify <major.minor.patch>, e.g. 7.1.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Configure git
        run: |
          git config --global user.name 'embrace-ci[bot]'
          git config --global user.email 'embrace-ci@users.noreply.github.com'

      - name: Extract base version (major.minor.0)
        id: base_version
        env:
          RC_VERSION: ${{ inputs.rc_version }}
        run: |
          if [[ ! "$RC_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "rc_version must be <major.minor.patch>, got '$RC_VERSION'"
            exit 1
          fi
          base_version=$(echo "$RC_VERSION" | cut -d. -f1,2).0
          echo "base_version=$base_version" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/${{ steps.base_version.outputs.base_version }}
          persist-credentials: true

      # Hotfixes reuse the release/X.Y.0 branch, so the version needs bumping before publishing.
      - name: Set version in gradle.properties
        env:
          RC_VERSION: ${{ inputs.rc_version }}
          RELEASE_BRANCH: release/${{ steps.base_version.outputs.base_version }}
        run: |
          current_version=$(sed -n -r "s#^version=(.*)#\1#p" gradle.properties)
          if [[ ! "$current_version" =~ ^([0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            echo "Unexpected version '$current_version' in gradle.properties on ${RELEASE_BRANCH}"
            exit 1
          fi
          current_minor=${BASH_REMATCH[1]}
          current_patch=${BASH_REMATCH[2]}
          [[ "$RC_VERSION" =~ ^([0-9]+\.[0-9]+)\.([0-9]+)$ ]]
          if [[ "$current_minor" != "${BASH_REMATCH[1]}" ]] || (( 10#$current_patch > 10#${BASH_REMATCH[2]} )); then
            echo "Refusing to change version from ${current_version} to ${RC_VERSION} on ${RELEASE_BRANCH}"
            exit 1
          fi
          sed -i -r "s#^version=.*#version=${RC_VERSION}#" gradle.properties
          if ! grep -qx "version=${RC_VERSION}" gradle.properties; then
            echo "Failed to set version=${RC_VERSION} in gradle.properties"
            exit 1
          fi
          if [[ `git status --porcelain` ]]; then
            git add gradle.properties
            git commit -m "CI/CD: change version to be released: ${RC_VERSION}"
            git push origin HEAD:${RELEASE_BRANCH}
          else
            echo "gradle.properties already set to ${RC_VERSION}"
          fi

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Publish to Maven Central
        run: |
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache --stacktrace

      - name: Publish git tag
        env:
          RC_VERSION: ${{ inputs.rc_version }}
        run: |
          git push origin :refs/tags/${RC_VERSION}
          git tag -f ${RC_VERSION}
          git push origin --tags
