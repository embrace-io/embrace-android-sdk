buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url = uri(providers.gradleProperty("integration_repo").get()) }
    }
    dependencies {
        classpath("com.android.tools.build:gradle:$agp_version")
        classpath "io.embrace:embrace-gradle-plugin:$plugin_snapshot_version"
        classpath "io.embrace:embrace-gradle-plugin-integration-tests:$plugin_snapshot_version"
        classpath("com.facebook.react:react-native-gradle-plugin")
    }
}
