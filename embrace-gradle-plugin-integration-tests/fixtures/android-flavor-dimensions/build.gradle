plugins {
    id("com.android.application")
    id("io.embrace.gradle")
    id("io.embrace.android.testplugin")
}

integrationTest.configureAndroidProject(project)

android {
    buildTypes {
        custom {
            minifyEnabled = true
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }
    flavorDimensions "tier", "store"
    productFlavors {
        demo {
            dimension "tier"
            versionNameSuffix "-demo"
        }
        full {
            dimension "tier"
            versionNameSuffix "-full"
        }
        play {
            dimension "store"
        }
        amazon {
            dimension "store"
        }
    }
}

embrace {
    buildVariantFilter {
        if (it.name == "fullPlayRelease") {
            it.disablePluginForVariant()
        }
    }
}
