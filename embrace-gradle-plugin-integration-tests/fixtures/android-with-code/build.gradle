plugins {
    id("com.android.application")
    id("io.embrace.gradle")
    id("io.embrace.android.testplugin")
}

repositories {
    google()
    mavenCentral()
    maven { url = uri(providers.gradleProperty("integration_repo").get()) }
}

integrationTest.configureAndroidProject(project)

embrace {
    autoAddEmbraceDependencies.set(true)
}

android {
    buildTypes {
        // builds with src/overrides/embrace-config.json, which sets non-default values
        overrides {
            initWith(release)
            minifyEnabled = false
        }
    }
    // native libs are hashed and injected into Base64SharedObjectFilesMapImpl on release
    externalNativeBuild {
        cmake {
            path("src/main/cpp/CMakeLists.txt")
        }
    }
}
