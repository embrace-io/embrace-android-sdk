name: Emulator dispatch

# Builds examples/ExampleApp against an SDK ref, points it at a chosen Embrace app and backend, boots an API 29
# emulator, runs a caller-supplied adb script against the running app, and uploads the device id, the session
# part id(s) and the filtered logcat as the `emulator-dispatch` artifact.
#
#   gh workflow run emulator-dispatch.yml --ref main \
#     -f sdk_ref=<full commit sha> -f app_id=<5 chars> \
#     -f data_base_url=<url> -f config_base_url=<url> \
#     -f adb_script="$(cat script.sh)"
#
# `--ref` picks which copy of this workflow runs (GitHub only dispatches a workflow whose file is on the default
# branch); `sdk_ref` picks the SDK and ExampleApp sources that get built, and the build runs that code. The driver
# script comes from the workflow's own ref (the `tooling` checkout), not from `sdk_ref`.
#
# adb_script runs as bash on the runner (not on the device) with the emulator booted and the app already launched,
# so write `adb shell ...` for the device. It sees APP_PACKAGE, APP_ACTIVITY and EMULATOR_DISPATCH_OUT (files
# written there are uploaded). Only people who can dispatch workflows here can run it; the job holds a read-only
# token and no secrets.
#
# This repository is public: the job log, the step summary and the artifact are public too. They carry the app id,
# both base URLs, the device and session ids and logcat. Never point this at production (emb-api.com is refused) or
# at an app with real users' data.
#
# Reading the artifact (summary.json is the entry point):
#   embrace_device_id        read from the app's SharedPreferences
#   session_part_ids         from ExampleApp's logcat exporter, logged when the session part ends
#   stored_session_part_ids  session parts whose payload file is STILL in the app's storage, so NOT YET delivered
#   payload_delivered        true once the SDK had stored and then deleted (delivered) the payload for every
#                            session part id; false does not fail the job (a dead data URL is a legitimate dry run)

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: Full 40-character commit SHA of this repository to build the SDK and ExampleApp from
        required: true
        type: string
      app_id:
        description: The 5-character Embrace app id to inject into ExampleApp's embrace-config.json
        required: true
        type: string
      data_base_url:
        description: sdk_config.base_urls.data (where the SDK uploads telemetry)
        required: true
        type: string
      config_base_url:
        description: sdk_config.base_urls.config (where the SDK fetches remote config)
        required: true
        type: string
      adb_script:
        description: Bash script run against the booted emulator once the app is launched
        required: true
        type: string
        # Android thermal state: enter SEVERE, return to NONE, then background the app to end the session part.
        default: |
          adb shell cmd thermalservice reset
          adb shell am start -n "$APP_PACKAGE/$APP_ACTIVITY"
          sleep 8
          adb shell cmd thermalservice override-status 3
          sleep 10
          adb shell cmd thermalservice override-status 0
          sleep 3
          adb shell input keyevent KEYCODE_HOME
  # Lets a caller workflow run this with the same inputs, which is how a branch is proven before this file is on
  # the default branch.
  workflow_call:
    inputs:
      sdk_ref:
        description: Full 40-character commit SHA of this repository to build the SDK and ExampleApp from
        required: true
        type: string
      app_id:
        description: The 5-character Embrace app id to inject into ExampleApp's embrace-config.json
        required: true
        type: string
      data_base_url:
        description: sdk_config.base_urls.data (where the SDK uploads telemetry)
        required: true
        type: string
      config_base_url:
        description: sdk_config.base_urls.config (where the SDK fetches remote config)
        required: true
        type: string
      adb_script:
        description: Bash script run against the booted emulator once the app is launched
        required: true
        type: string

env:
  ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 60

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: 29
      APP_PACKAGE: io.embrace.android.exampleapp
      APP_ACTIVITY: .MainActivity
      EMULATOR_DISPATCH_OUT: ${{ github.workspace }}/emulator-dispatch-out
    steps:
      - name: Validate inputs
        env:
          SDK_REF: ${{ inputs.sdk_ref }}
          APP_ID: ${{ inputs.app_id }}
          DATA_BASE_URL: ${{ inputs.data_base_url }}
          CONFIG_BASE_URL: ${{ inputs.config_base_url }}
          ADB_SCRIPT: ${{ inputs.adb_script }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          check_url() {
            local name=$1 url=$2 host
            [[ "$url" =~ ^https?://[^[:space:]]+$ ]] || fail "$name must be an http(s) URL"
            [[ "$url" != */ ]] || fail "$name must not end with a slash"
            host=${url#*://}; host=${host%%[/?#]*}; host=${host##*@}; host=${host%%:*}; host=${host,,}
            [ -n "$host" ] || fail "$name has no host"
            [[ "$host" != *emb-api.com ]] || fail "$name points at production (emb-api.com), which this workflow refuses"
          }
          [[ "$SDK_REF" =~ ^[0-9a-f]{40}$ ]] || fail "sdk_ref must be a full 40-character lowercase commit SHA"
          [[ "$APP_ID" =~ ^[A-Za-z0-9]{5}$ ]] || fail "app_id must be exactly 5 letters or digits"
          check_url data_base_url "$DATA_BASE_URL"
          check_url config_base_url "$CONFIG_BASE_URL"
          [[ "$ADB_SCRIPT" =~ [^[:space:]] ]] || fail "adb_script must not be empty"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sdk_ref }}
          persist-credentials: false

      # The driver script comes from this workflow's own ref: an older sdk_ref does not have it. Checked out second,
      # into its own directory, because a checkout cleans its target directory.
      - name: Checkout the driver script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          sparse-checkout: .github/scripts
          persist-credentials: false

      # ExampleApp resolves the SDK and the Embrace Gradle plugin from Maven at the version in its catalog, with
      # mavenLocal() listed last. Publishing this checkout to mavenLocal under a -SNAPSHOT version (which Maven
      # Central never serves) and pointing the catalog at it makes the app build from the checked-out sources.
      - name: Pin the SDK version
        id: sdk
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          [ -n "$version" ] || { echo "::error::no version= in gradle.properties"; exit 1; }
          case "$version" in
            *-SNAPSHOT) ;;
            *)
              version="$version-SNAPSHOT"
              sed -i -E "s#^version=.*#version=${version}#" gradle.properties
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Building SDK $version from $(git rev-parse HEAD)"

      # `$/` resolves to this repository at the commit the workflow is running from, with no checkout. Do not write
      # `./.github/actions/...` here: after the sdk_ref checkout that path is the untrusted ref's copy of the action
      # (missing for a ref that predates it, and free to turn the Gradle cache back to read-write).
      - name: Set up the emulator
        uses: $/.github/actions/emulator-setup
        with:
          avd-cache: 'false'
          # sdk_ref's build code is untrusted here, so it must never write the shared Gradle cache.
          cache-read-only: 'true'

      - name: Publish the SDK and Gradle plugin to mavenLocal
        run: ./gradlew publishToMavenLocal --no-configuration-cache --stacktrace

      - name: Point ExampleApp at the published SDK and inject its Embrace config
        env:
          SDK_VERSION: ${{ steps.sdk.outputs.version }}
          SDK_SHA: ${{ steps.sdk.outputs.sha }}
          SDK_REF: ${{ inputs.sdk_ref }}
          APP_ID: ${{ inputs.app_id }}
          DATA_BASE_URL: ${{ inputs.data_base_url }}
          CONFIG_BASE_URL: ${{ inputs.config_base_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          catalog=examples/ExampleApp/gradle/libs.versions.toml
          sed -i -E "s/^embrace = \".*\"/embrace = \"${SDK_VERSION}\"/" "$catalog"
          grep -qxF "embrace = \"${SDK_VERSION}\"" "$catalog" \
            || { echo "::error::could not set the embrace version in $catalog"; exit 1; }

          # Field names are the ones in embrace-config-schema.json. The Gradle plugin bakes the file into the
          # app's bytecode at build time, so this has to happen before the build. The log is public, so the file
          # is not printed.
          config=examples/ExampleApp/app/src/main/embrace-config.json
          jq --arg app_id "$APP_ID" --arg data "$DATA_BASE_URL" --arg config "$CONFIG_BASE_URL" \
            'del(.api_token) | .app_id = $app_id | .sdk_config.base_urls = {data: $data, config: $config}' \
            "$config" > "$RUNNER_TEMP/embrace-config.json"
          mv "$RUNNER_TEMP/embrace-config.json" "$config"
          jq -e --arg app_id "$APP_ID" --arg data "$DATA_BASE_URL" --arg config "$CONFIG_BASE_URL" \
            '.app_id == $app_id and .sdk_config.base_urls.data == $data and .sdk_config.base_urls.config == $config and (has("api_token") | not)' \
            "$config" > /dev/null || { echo "::error::the Embrace config was not injected as expected"; exit 1; }
          echo "Injected app_id and sdk_config.base_urls into $config"

          mkdir -p "$EMULATOR_DISPATCH_OUT"
          jq -n --arg sdk_ref "$SDK_REF" --arg sdk_sha "$SDK_SHA" --arg sdk_version "$SDK_VERSION" \
            --arg app_id "$APP_ID" --arg data "$DATA_BASE_URL" --arg config "$CONFIG_BASE_URL" \
            --arg run_url "$RUN_URL" \
            '{run_url: $run_url, sdk_ref: $sdk_ref, sdk_sha: $sdk_sha, sdk_version: $sdk_version, app_id: $app_id,
              data_base_url: $data, config_base_url: $config}' > "$EMULATOR_DISPATCH_OUT/run-info.json"

      # The build-data and mapping uploads would send this build to Embrace's production symbol store.
      - name: Build ExampleApp
        working-directory: examples/ExampleApp
        run: ./gradlew :app:assembleDebug -Pembrace.disableCollectBuildData=true -Pembrace.disableMappingFileUpload=true --stacktrace

      - name: Write the adb script
        env:
          ADB_SCRIPT: ${{ inputs.adb_script }}
        run: |
          mkdir -p "$RUNNER_TEMP/emulator-dispatch" "$EMULATOR_DISPATCH_OUT"
          printf '%s\n' "$ADB_SCRIPT" | tr -d '\r' > "$RUNNER_TEMP/emulator-dispatch/adb-script.sh"
          cp "$RUNNER_TEMP/emulator-dispatch/adb-script.sh" "$EMULATOR_DISPATCH_OUT/adb-script.sh"

      # The emulator needs the runner's memory, and a daemon holding the untrusted build's classpath has no use now.
      - name: Stop Gradle daemons
        run: |
          ./gradlew --stop
          (cd examples/ExampleApp && ./gradlew --stop)

      # A clean device each run: no AVD cache, so nothing from an earlier run's build code is restored into this one.
      - name: Install, launch and drive the app on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        timeout-minutes: 20
        env:
          ADB_SCRIPT_FILE: ${{ runner.temp }}/emulator-dispatch/adb-script.sh
        with:
          api-level: ${{ env.API_LEVEL }}
          script: bash "$GITHUB_WORKSPACE/tooling/.github/scripts/emulator-dispatch-drive.sh"

      - name: Summarize
        if: ${{ always() }}
        run: |
          summary="$EMULATOR_DISPATCH_OUT/summary.json"
          {
            echo '### Emulator dispatch'
            if [ -f "$summary" ]; then
              printf '%s\n' '```json'
              cat "$summary"
              printf '%s\n' '```'
            else
              echo 'No summary.json: the run failed before the emulator step. See the job log.'
            fi
            echo 'Artifact "emulator-dispatch": summary.json (device and session ids), logcat-embrace.txt,'
            echo 'logcat-exampleapp.txt (session part ids), logcat-full.txt, adb-script.log.'
            echo 'stored_session_part_ids are the session parts NOT YET delivered; payload_delivered says whether'
            echo 'every session part id had its payload stored and then delivered.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-dispatch
          path: emulator-dispatch-out
          if-no-files-found: warn
          retention-days: 14
