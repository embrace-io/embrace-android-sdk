## Line numbers are needed to symbolicate crash stacktraces, and RuntimeVisibleAnnotations to read
## the startup/UI load annotations on customer activities (see UiLoadExt.kt and StartupTracker.kt).
-keepattributes LineNumberTable, SourceFile, RuntimeVisibleAnnotations

## Public entrypoint, referenced by name from hosted SDKs (e.g. Unity).
-keep class io.embrace.android.embracesdk.Embrace { public *; }

## Gradle plugin config hooks, looked up by class & method name. See ConfigClassVisitorFactory.
-keep class io.embrace.android.embracesdk.internal.config.instrumented.*Impl { <methods>; }
-keep interface io.embrace.android.embracesdk.internal.config.instrumented.schema.* { <methods>; }
-keep enum io.embrace.android.embracesdk.internal.config.instrumented.schema.WebViewFragmentCapture { public static <fields>; }
