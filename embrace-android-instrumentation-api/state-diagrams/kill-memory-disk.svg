<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 474" width="960" height="474" role="img" aria-labelledby="kill-memory-disk-title kill-memory-disk-desc">
<title id="kill-memory-disk-title">The journal&#x27;s records at the moment a process is killed, on disk and in memory</title>
<desc id="kill-memory-disk-desc">A session part&#x27;s journal is a strip of records appended in order: a checkpoint, the changes held from before the part, a part start, then the part&#x27;s changes. At a kill the records already appended survive and the next launch delivers them, marked as cut short, while records still queued in memory, and changes held with no part, are lost.</desc>
