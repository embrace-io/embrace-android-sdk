# https://detekt.dev/docs/introduction/configurations/
build:
  maxIssues: 0
complexity:
  NestedBlockDepth:
    threshold: 10
  LargeClass:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
  LongMethod:
    active: false
  LongParameterList:
    constructorThreshold: 30
    functionThreshold: 15
    ignoreDataClasses: true
  TooManyFunctions:
    thresholdInFiles: 31
    thresholdInClasses: 31
    thresholdInInterfaces: 31
    thresholdInObjects: 31
    thresholdInEnums: 31
    ignoreOverridden: true
empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true
exceptions:
  InstanceOfCheckForException:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    excludes:
      - '**/test/**'
      - '**/androidTest/**'
formatting:
  ArgumentListWrapping:
    maxLineLength: 140
  MaximumLineLength:
    maxLineLength: 140
  TrailingCommaOnCallSite:
    active: true
  TrailingCommaOnDeclarationSite:
    active: true
potential-bugs:
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
style:
  ForbiddenImport:
    active: true
    # kotlinx.serialization.serializer / serializerOrNull resolve a serializer at runtime. Forbid their use in production,
    # but allow usage in tests. Instead, prod code should use the generated serializers (e.g. ListSerializer).
    imports: [ 'android.util.Pair', 'kotlinx.serialization.serializer', 'kotlinx.serialization.serializerOrNull' ]
    excludes: [ '**/test/**', '**/integrationTest/**', '**/androidTest/**', '**/testFixtures/**' ]
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    active: false
  BracesOnIfStatements:
    active: true
    singleLine: 'consistent'
    multiLine: 'always'
  MandatoryBracesLoops:
    active: true
  SpacingBetweenPackageAndImports:
    active: true
  UnusedImports:
    active: true

  # Avoid business logic in payload/config classes
  DataClassShouldBeImmutable:
    active: true
    includes: [ '**/io/embrace/android/embracesdk/payload/**' ]
  DataClassContainsFunctions:
    active: true
    includes: [ '**/io/embrace/android/embracesdk/payload/**' ]
