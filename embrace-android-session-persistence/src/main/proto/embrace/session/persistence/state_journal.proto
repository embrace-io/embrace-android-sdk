syntax = "proto3";

package embrace.session.persistence;

option java_package = "io.embrace.android.embracesdk.internal.session.persistence";

// The journal of state changes persisted for one session part. It is only ever appended to: each
// append is a StateJournal message holding the records being added, so the file as a whole reads
// back as one StateJournal with every record in the order it was appended.
//
// A journal opens with a checkpoint, then the changes made since it and before the session part
// started, then a part start, then the changes made during the part, and a part end if the part
// ended in the process that started it. The changes are in the order of their sequence. Those
// before the part start are consecutive from the sequence after the checkpoint's. A change made
// during the part that a limit refused is not recorded and keeps its number, so the numbers of the
// changes after the part start can skip, anywhere among them. The part end counts what is missing.
message StateJournal {
  uint32 format_version = 1;
  repeated StateRecord records = 2;

  // When the write ending with this field was made, in milliseconds since the epoch by the SDK clock.
  // Every write to the journal ends with one, after its records. 0 if unknown.
  int64 written_at_ms = 3;
}

// One entry in the journal. Exactly one of checkpoint, change, part_start and part_end is set.
message StateRecord {
  // The place of this record in the order of state changes, which runs for the life of the process.
  // A change takes the next number. Any other record carries the number of the last change before it.
  int64 sequence = 1;

  // When what the record describes happened, in milliseconds since the epoch.
  int64 time_ms = 2;

  StateCheckpoint checkpoint = 3;
  StateChange change = 4;
  StatePartStart part_start = 5;
  StatePartEnd part_end = 6;
}

// The value of one state.
message StateValue {
  // The name of the state, such as "network".
  string state = 1;
  string value = 2;

  // Whether the value was generated by the SDK rather than observed from the app.
  bool system = 3;
}

// The value of every state being captured, as of the record's sequence.
message StateCheckpoint {
  repeated StateValue values = 1;
}

// One state taking a new value. A state's first value is recorded as a change too.
message StateChange {
  StateValue value = 1;
  map<string, string> attributes = 2;
}

// The session part the journal belongs to started. The changes recorded before it were made with
// no session part in progress.
message StatePartStart {
  // Changes made with no session part in progress that the journal does not hold as records, as
  // there were more than are kept. They are the oldest, and the checkpoint is the values after them.
  int32 dropped_changes = 1;
}

// The session part ended in the process that started it.
message StatePartEnd {
  // Changes made during the part that took a number and were not recorded, as a limit refused
  // them: the limit of the change's own state, or the limit on the journal as a whole.
  int32 dropped_changes = 1;

  // The value, when the part ended, of each state that had a change refused, as that value cannot
  // be worked out from the records. A journal written before states had limits of their own holds
  // every state's value here, whenever it dropped a change.
  repeated StateValue values = 2;

  // What the journal does not list of each state, for the states it does not list something of.
  // A journal written before states had limits of their own holds none.
  repeated StateDroppedCount dropped_counts = 3;

  // The most changes the journal holds for every state together, counting those it opened with.
  // Set only if that limit refused a change during the part.
  optional int32 shared_limit = 4;
}

// How many changes of one state the journal of a session part does not list.
message StateDroppedCount {
  // The name of the state.
  string state = 1;

  // The changes of the state made during the part that a limit refused, which took a number, and
  // the changes the state's reporter said it never passed on, which took none. Those reported
  // while no session part was in progress are counted in the journal of the next part to start.
  int32 count = 2;

  // The most changes of the state that one session part lists. Set only if that limit, and not
  // the limit on the journal as a whole, refused a change of the state during the part.
  optional int32 limit = 3;
}
