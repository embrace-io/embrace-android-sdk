syntax = "proto3";

package embrace.session.persistence;

import "embrace/session/persistence/span.proto";

option java_package = "io.embrace.android.embracesdk.internal.session.persistence";

// An append-only collection of spans for one session part, held in completed_spans.pb or
// span_snapshots.pb.
//
// Records are appended in the order they are written. A format_version record discards every
// record before it, and in span_snapshots.pb a span record supersedes any earlier record for the
// same span ID.
message SpanCollection {
  uint32 format_version = 1;
  repeated SpanProto spans = 2;
}
