# yaml-language-server: $schema=../../../buildSrc/src/main/resources/config.schema.json
AppStateConfig:
  shared_state_span_enabled:
    property: enabled
    default: false
    local:
      type: Boolean
      json: sdk_config.shared_state_span_enabled
    remote:
      type: Pct
      sdk: pctSharedStateSpanEnabled
  state_association_enabled:
    property: associationEnabled
    default: false
    local:
      type: Boolean
      json: sdk_config.state_association_enabled
    remote:
      type: Pct
      sdk: pctStateAssociationEnabled
  state_export_mode:
    property: exportMode
    default: ""
    local:
      type: String
      json: sdk_config.state_export_mode
    remote:
      type: String
      sdk: stateExportMode
PersistenceConfig:
  multi_file_persistence_enabled:
    property: multiFileEnabled
    default: false
    local:
      type: Boolean
      json: sdk_config.multi_file_persistence_enabled
    remote:
      type: Pct
      sdk: pctMultiFilePersistenceEnabled
LogConfig:
  max_length:
    property: maxMessageLength
    default: 128
    remote:
      type: Int
      sdk: logConfig?.logMessageMaximumAllowedLength
      parent_type: LogRemoteConfig
  info_limit:
    property: infoLimit
    default: 100
    remote:
      type: Int
      sdk: logConfig?.logInfoLimit
      parent_type: LogRemoteConfig
  warn_limit:
    property: warnLimit
    default: 200
    remote:
      type: Int
      sdk: logConfig?.logWarnLimit
      parent_type: LogRemoteConfig
  error_limit:
    property: errorLimit
    default: 500
    remote:
      type: Int
      sdk: logConfig?.logErrorLimit
      parent_type: LogRemoteConfig
