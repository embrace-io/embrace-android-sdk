name: Generate Baseline Profile

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up the emulator
        uses: $/.github/actions/emulator-setup
        with:
          avd-cache: 'false'

      # Runs on a pixel6Api34 managed AOSP device - see BaselineProfileGenerator before changing this image.
      - name: Generate Baseline Profile
        run: |
          set -- --gradle-arg -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --gradle-arg -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1
          scripts/generate-baseline-profile.sh "$@" || scripts/generate-baseline-profile.sh --no-publish "$@"

      - name: Archive generator outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-profile-outputs
          path: |
            embrace-macrobenchmark/build/outputs/managed_device_android_test_additional_output/
            embrace-macrobenchmark/build/outputs/androidTest-results/

      - name: Create baseline profile PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'embrace-ci[bot]'
          git config --global user.email 'embrace-ci@users.noreply.github.com'

          branch=baseline-profile-${{ github.run_id }}
          git checkout -b $branch

          if [[ `git status --porcelain` ]]; then
            git add embrace-android-sdk/src/main/baseline-prof.txt
            git commit -m "Generate baseline profiles"
            git push -f origin $branch

            gh pr create \
                --base main \
                --head $branch \
                --title "Generate baseline profile ${GITHUB_REF}" \
                --body "Baseline Profiles help guide optimization beyond app startup by providing common user interactions that improve app runtime from the first launch" \
                --assignee ${GITHUB_ACTOR}
          else
            echo "No changes to commit"
          fi
