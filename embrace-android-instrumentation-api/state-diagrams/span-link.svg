<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="span-link-title span-link-desc">
<title id="span-link-title">A span on a timeline of state changes, with its two sequence numbers</title>
<desc id="span-link-desc">Two states change during a session part, and each change takes the next number in one sequence: 41, then 42. A span that starts after change 41 and ends after change 42 carries emb.state.seq 41 and emb.state.end_seq 42, and a log emitted after change 42 carries that number and every state&#x27;s value.</desc>
