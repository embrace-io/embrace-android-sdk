apply plugin: "com.android.application"
apply plugin: 'io.embrace.gradle'
apply plugin: "com.facebook.react"
apply plugin: "io.embrace.android.testplugin"

repositories {
    google()
    mavenCentral()
    maven { url = uri(providers.gradleProperty("integration_repo").get()) }
}

android {
    namespace "com.rnapp"
    compileSdk 36
    defaultConfig {
        applicationId "com.rnapp"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
}

embrace {
    autoAddEmbraceDependencies.set(true)
}
