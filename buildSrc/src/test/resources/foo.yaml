FooConfig:
  foo_enabled:
    property: enabled
    default: false
    local:
      type: Boolean
      json: sdk_config.foo_enabled
    remote:
      type: Pct
      sdk: pctFooEnabled
  foo_limit:
    property: limit
    default: 10
    local:
      type: Int
      json: sdk_config.foo.limit
    remote:
      type: Int
      sdk: fooLimit
  foo_name:
    property: name
    default: "a \"b\" $c"
    remote:
      type: String
      sdk: fooName
BarConfig:
  bar_limit:
    property: limit
    default: 10
    local:
      type: Int
      json: bar_limit
RangeConfig:
  bounded:
    property: bounded
    default: 10
    min: 1
    max: 100
    local:
      type: Int
      json: sdk_config.range.bounded
    remote:
      type: Int
      sdk: rangeBounded
  name:
    property: name
    default: abc
    max_length: 5
    remote:
      type: String
      sdk: rangeName
